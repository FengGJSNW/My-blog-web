<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Exporter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 300px;
      padding: 20px;
      background-color: #f5f5f5;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #666;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #45a049;
    }
    #jsonRulesPreview {
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px;
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
    }
    .alert {
      padding: 10px;
      background-color: #f44336;
      color: white;
      margin-top: 10px;
      border-radius: 4px;
    }
    .appreciation {
      margin-top: 20px;
      text-align: center;
      font-style: italic;
      color: #666;
    }
    #languageToggle {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 5px 10px;
      background-color: #ddd;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="languageToggle" data-i18n="toggleLanguage">English</button>
  <h1 data-i18n="title">Chat Exporter</h1>
  <div id="jsonRulesContainer">
    <div class="form-group">
      <label for="chatContainer" data-i18n="chatContainerLabel">聊天容器选择器:</label>
      <input type="text" id="chatContainer" data-i18n-placeholder="chatContainerPlaceholder">
    </div>
    <div class="form-group">
      <label for="messageAuthorRole" data-i18n="messageAuthorRoleLabel">消息作者角色选择器:</label>
      <input type="text" id="messageAuthorRole" data-i18n-placeholder="messageAuthorRolePlaceholder">
    </div>
    <div class="form-group">
      <label for="userMessage" data-i18n="userMessageLabel">用户消息选择器:</label>
      <input type="text" id="userMessage" data-i18n-placeholder="userMessagePlaceholder">
    </div>
    <div class="form-group">
      <label for="assistantMessage" data-i18n="assistantMessageLabel">助手消息选择器:</label>
      <input type="text" id="assistantMessage" data-i18n-placeholder="assistantMessagePlaceholder">
    </div>
    <div class="form-group">
      <label for="codeBlock" data-i18n="codeBlockLabel">代码块选择器:</label>
      <input type="text" id="codeBlock" data-i18n-placeholder="codeBlockPlaceholder">
    </div>
    <button id="jsonRulesPreviewBtn" data-i18n="previewRules">预览规则</button>
    <div id="jsonRulesPreview"></div>
  </div>
  <button id="resetButton" data-i18n="reset">重置规则</button>
  <button id="exportMarkdownBtn" data-i18n="exportMarkdown">导出为 Markdown</button>
  <button id="exportJsonlBtn" data-i18n="exportJsonl">导出为 JSONL</button>
  <button id="exportPdfBtn" data-i18n="exportPdf">导出为 PDF</button>
  <div id="updateAlert" class="alert" style="display:none"></div>
  <div id="appreciation" class="appreciation">
    <p data-i18n="appreciationText">如果你喜欢这个插件，欢迎支持我们：</p>
    <p><a href="https://afdian.com/a/rythmeol" target="_blank" ><span data-i18n="appreciationLink">爱发电</span></a></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
